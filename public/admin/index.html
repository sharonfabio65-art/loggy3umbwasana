<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  display: flex; justify-content: center; align-items: center; padding: 20px;
}
.card {
  background: #fff; border-radius: 24px; padding: 40px 32px;
  width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
h1 { font-size: 24px; font-weight: 700; color: #1f2937; text-align: center; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
input {
  width: 100%; padding: 14px 16px;
  border: 1.5px solid #e5e7eb; border-radius: 12px;
  font-size: 15px; outline: none; transition: border-color 0.2s;
}
input:focus { border-color: #4a4ff0; }
button {
  width: 100%; padding: 15px;
  background: linear-gradient(90deg, #4a4ff0, #7c3aed);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
button:disabled { opacity: 0.7; cursor: not-allowed; }
.error-label { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Admin Login</h1>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" value="admin@atlas.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" value="admin123">
  </div>
  <button id="loginBtn">Login</button>
  <div id="errorLabel" class="error-label"></div>
</div>
<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorLabel');
  btn.disabled = true;
  btn.textContent = 'Logging in...';
  err.style.display = 'none';
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success && data.token) {
      localStorage.setItem('adminToken', data.token);
      window.location.href = '/admin/dashboard';
    } else {
      err.textContent = data.error || 'Invalid credentials';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login';
    }
  } catch (e) {
    err.textContent = 'Network error';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
