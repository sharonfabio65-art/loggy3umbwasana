<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas - Status</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  display: flex; justify-content: center; align-items: center; padding: 20px;
}
.card {
  background: #fff; border-radius: 24px; padding: 48px 32px;
  width: 100%; max-width: 420px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.sad-icon { width: 100px; height: 100px; margin: 0 auto 24px; }
h1 { font-size: 24px; font-weight: 700; color: #1f2937; margin-bottom: 12px; line-height: 1.4; }
p { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
.email-display {
  display: inline-block; margin-top: 16px; padding: 8px 16px;
  background: #f3f4f6; border-radius: 8px; color: #4a4ff0;
  font-size: 13px; font-weight: 500; word-break: break-all;
}
</style>
</head>
<body>
<div class="card">
  <svg class="sad-icon" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="10" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M8 14 C8 14 9.5 16 12 16 C14.5 16 16 14 16 14" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="9" cy="9" r="1" fill="#dc2626"/>
    <circle cx="15" cy="9" r="1" fill="#dc2626"/>
  </svg>
  <h1>Unfortunately, you are not eligible for this offer</h1>
  <p>We are truly sorry.</p>
  <div class="email-display" id="emailDisplay"></div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const e = p.get('email');
if (e) document.getElementById('emailDisplay').textContent = e;
</script>
</body>
</html>
